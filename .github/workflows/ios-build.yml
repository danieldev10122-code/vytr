name: Build VYTR IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests run beside the build rather than before it. Booting a simulator
  # costs minutes, and making every IPA wait on that turned a 40 second
  # turnaround into six. Both jobs must pass for the run to be green.
  test:
    name: Unit tests
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          # Pick whatever simulator the image actually has, rather than
          # naming a device that may not exist on a future runner image.
          UDID=$(xcrun simctl list devices available             | grep -oE '\(([0-9A-F]{8}-[0-9A-F-]+)\)'             | tr -d '()'             | head -n 1)
          if [ -z "$UDID" ]; then
            echo "::error::No iOS simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator $UDID"

          xcodebuild test             -project VYTR.xcodeproj             -scheme VYTR             -destination "id=$UDID"             -derivedDataPath build-tests             | tee test.log             | grep -E "Test Case .* (passed|failed)|error:" || true

          # tee swallows xcodebuild's exit status. -F matters: without it
          # grep reads the leading ** as a regex quantifier, errors with
          # exit 2, and fails the step even when every test passed.
          grep -qF "** TEST SUCCEEDED **" test.log

      - name: Summarise
        if: always()
        run: |
          PASSED=$(grep -c "' passed (" test.log 2>/dev/null || echo 0)
          FAILED=$(grep -c "' failed (" test.log 2>/dev/null || echo 0)
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Passed | Failed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| $PASSED | $FAILED |" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Unsigned IPA

    # Pinned to xcode-27 on evidence, not assumption: run 38872355660 built
    # on xcode-27 and macos-26 side by side. xcode-27 linked the app against
    # iphoneos27.0, matching the iOS 27 target device, while macos-26 linked
    # against iphoneos26.5. iOS grants the current system appearance based on
    # the SDK an app was linked against, so the newer SDK is the right choice.
    #
    # The xcode-27 runner image is in public preview. If it is ever withdrawn
    # or starts failing, macos-26 is a verified fallback: change this one line.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project VYTR.xcodeproj \
            -scheme VYTR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/VYTR.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          # An asset catalog that fails to assign its icon only warns, so
          # the build stays green and ships without one. Check the result
          # rather than the exit code.
          if [ ! -f "$APP/Assets.car" ]; then
            echo "::error::Assets.car is missing - the app icon did not compile into the bundle"
            ls -la "$APP"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::Info.plist has no CFBundleIcons - iOS would show a blank icon"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -0 -y -qr VYTR.ipa Payload

          echo "### Build result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| IPA size | $(du -h VYTR.ipa | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linked SDK | $(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Minimum iOS | $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle ID | $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist") |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: VYTR-ipa
          path: VYTR.ipa
          retention-days: 30
