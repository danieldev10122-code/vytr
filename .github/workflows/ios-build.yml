name: Build VYTR IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Unsigned IPA (${{ matrix.runner }})

    # Stage 1 builds on both images to find out which one actually works,
    # rather than assuming. The target device runs iOS 27, so xcode-27 is
    # the preferred image, but its runner image is still in public preview.
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-26]

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "--- available iOS SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project VYTR.xcodeproj \
            -scheme VYTR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/VYTR.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -0 -y -qr "VYTR-${{ matrix.runner }}.ipa" Payload
          ls -lh "VYTR-${{ matrix.runner }}.ipa"
          echo "--- SDK the app was linked against ---"
          /usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: VYTR-${{ matrix.runner }}
          path: VYTR-${{ matrix.runner }}.ipa
          retention-days: 30
