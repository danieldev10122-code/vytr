name: Build VYTR IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project VYTR.xcodeproj \
            -scheme VYTR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/VYTR.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -0 -y -qr VYTR-unsigned.ipa Payload
          ls -lh VYTR-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: VYTR-unsigned-ipa
          path: VYTR-unsigned.ipa
          retention-days: 30
